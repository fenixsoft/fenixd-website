# =============================================================================
# .fenix/verify.yaml — 验证契约
# 2026-11-27 Administrator 起草（run admin-website-home-primary-pages-1795751860，
# spec=website-home-primary-pages）。字段语义见 core/verify_contract.py 模块文档。
#
# 站点形态（SPEC 设计 D1/D2/D5）：纯静态站点，python3 build_site.py 每轮验证前
# fresh 构建到 site/dist/，GitHub Pages artifact 同为 site/dist——serve kind=static
# 以 site/dist 为 URL 空间根目录（docroot），与 Pages 部署形态一致。
#
# regression 段省略：项目无测试体系（config commands.test 为占位符，本 SPEC
# 交付物无测试框架），不臆造无法产出 JUnit XML 的回归命令（臆造会让周期回归
# 每天 parse_error 空转）。
# =============================================================================

prepare:
  # build_site.py 为本 SPEC 实现交付物（tasks 2.x）；构建失败＝验证环境错误，
  # 走 infra-retry 廉价重试车道，不判产品缺陷。设计 D3：fenixd 浅克隆失败显式
  # 非零退出（构建依赖外网为已知风险，缓存 .site-cache/fenixd 复用缓解）。
  - run: python3 build_site.py

serve:
  kind: static
  root: site/dist

ready:
  url: /
  expect: 200
  timeout: 60
